version: '3.8'

services:
  postgres:
    container_name: postgres_circl
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: circl
    ports:
      - '5432:5432'
    volumes:
      - postgres_circl_data:/var/lib/postgresql/data/

  redis:
    container_name: circl_redis
    image: redis:latest
    ports:
      - '6379:6379'
    volumes:
      - circl_redis_data:/data

volumes:
  postgres_circl_data:
  circl_redis_data:
